# Config for the OUTER tmux, which is the test instrument -- never the thing under test.
#
# Everything here exists to make the outer tmux as transparent as possible: no status bar
# stealing a row, no mouse handling of its own (we inject mouse bytes straight to the inner
# program's PTY), no key interception, and a truecolor-capable TERM so the inner program
# emits the same escape sequences it would in a student's terminal.

set -g default-terminal "xterm-256color"
set -ga terminal-features ",xterm-256color:RGB:usstyle"
set -g status off
set -g mouse off
set -g history-limit 10000
set -g escape-time 0
set -g focus-events off
set -g remain-on-exit off
set -g destroy-unattached off
set -g exit-empty on
setw -g aggressive-resize off
setw -g automatic-rename off
# Let the inner program's OSC 52 clipboard writes through so we can observe them.
set -g set-clipboard on
set -g allow-passthrough on
