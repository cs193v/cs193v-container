# =============================================================================
# CS193V -- beginner-locked tmux configuration
# =============================================================================
#
# Installed as /etc/cs193v/tmux.conf and loaded with an explicit `-f` by
# /usr/local/bin/cs193v-shell.
#
# THE `-f` IS DELIBERATE AND LOAD-BEARING. tmux normally reads /etc/tmux.conf and then
# ~/.tmux.conf, with the user file winning -- so a student who creates ~/.tmux.conf could
# re-arm a prefix key and put back the 70 bindings this file exists to remove, then ask
# staff why their terminal does something nobody can reproduce. Naming the file with `-f`
# suppresses BOTH default paths, so this configuration is the whole of the configuration.
#
# PROVENANCE. This began as the Option B prototype in the sibling `multiplexer` project,
# which evaluated tmux, Zellij, byobu and dvtm against a written requirements list and
# settled on tmux. That prototype is a frozen record of the evaluation; THIS FILE IS THE
# FORK OF RECORD and the two are expected to diverge. Every place they already do is
# commented `# FORK:` below, with the reason.
#
# Target: tmux 3.6 (Ubuntu 26.04 main). The one 3.6-only block is version-gated, so the
# file also loads cleanly on 3.4 (Ubuntu 24.04).
#
# Design contract, in order of priority:
#   1. A fixed, tiny set of actions exists: new tab, tab left, tab right.
#   2. Everything else is REMOVED, not hidden. No prefix key at all.
#   3. The mouse still behaves the way a novice expects.
#   4. A student can never end up in a state they cannot get out of.
#
# -----------------------------------------------------------------------------


# =============================================================================
# PART 1 -- DISARM EVERYTHING
# =============================================================================
#
# tmux ships 70 prefix bindings, 19 root bindings, 74 copy-mode bindings and 87
# copy-mode-vi bindings. Every single one is a way for a beginner to break their
# session. `unbind -a -T <table>` empties a whole table; there is no "reset to
# nothing" option, so all four tables have to be named explicitly.
#
# `unbind -a` with no -T only clears the *prefix* table, which is why -T is
# spelled out every time.

unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi

# Kill the leader key itself. With `prefix None` the C-b byte is delivered
# straight to the program in the pane instead of being swallowed -- which also
# means C-b keeps working as "move cursor back" in bash/readline, exactly as it
# would outside tmux. `prefix2` is already None by default; set it anyway so the
# file is self-contained and does not depend on defaults.
set -g prefix None
set -g prefix2 None

# tmux's own command prompt / menus are only reachable from a keybinding, and
# there are none left. But `prefix-timeout` and `initial-repeat-time` govern
# multi-key sequences that no longer exist, so they are irrelevant here.
#
# mode-keys decides WHICH copy table (copy-mode vs copy-mode-vi) is consulted.
# Pin it so the set of live bindings is deterministic; both tables are emptied
# above and only `copy-mode` is repopulated below. Pinning also matters because
# tmux infers vi mode from $EDITOR/$VISUAL containing "vi", and a future editor
# change should not silently swap the live key table.
set -g mode-keys emacs
set -g status-keys emacs


# =============================================================================
# PART 2 -- THE ONLY ACTIONS THERE ARE (three, on two keys each)
# =============================================================================
#
# `-n` is the documented alias for `-T root`: no prefix, the bare key does it.
#
# -N attaches a human-readable note, so `tmux list-keys -N` doubles as the
# staff-facing cheat sheet and as documentation of intent.
#
# Flag order matters and fails SILENTLY if you get it wrong: `bind -n M-t -N
# "..." new-window` parses "-N" as the start of the *command*, registers nothing,
# and prints no error when sourced without an attached client. Options first,
# then the key, then the command.
#
# FORK: the prototype had exactly three bindings -- M-t, M-Left, M-Right. Those keys are
# unreachable on macOS without a per-terminal settings change that we cannot make for the
# student:
#
#     Terminal.app    Option composes (Option+T types "†"), unless "Use Option as Meta
#                     key" is ticked per profile
#     iTerm2          left Option defaults to Normal, not Esc+
#     VS Code         terminal.integrated.macOptionIsMeta defaults false
#     Ghostty / WezTerm / Alacritty
#                     all default to composing
#
# Linux and Windows terminals send the ESC-prefix form already, so the ALT keys work there.
# Rather than make macOS students edit their terminal before they can open a tab, each
# action gained a second key that needs no configuration anywhere:
#
#     C-t       a plain control byte (0x14). NO ENCODING RISK OF ANY KIND -- there is no
#               terminal that "sends Ctrl differently". Costs readline's transpose-chars,
#               the least-used binding in the set.
#     S-Left    CSI 1;2D / CSI 1;2C. Universally sent, but it IS a modified-key encoding,
#     S-Right   so it depends on the terminal emitting the modifier parameter. That is why
#               the NEW TAB key is the control byte and not S-Down: if shift+arrow turns
#               out not to be transmitted somewhere, a student there can still open tabs
#               (C-t) and still switch between them (by clicking), rather than losing the
#               whole tab system at once to one encoding assumption.
#
# The ALT keys are kept, not replaced -- they cost nothing and they are what a student who
# already knows tmux will reach for.
#
# S-Left / S-Right are swallowed from every application, including nano, which uses
# shift+arrow for selecting text. Accepted deliberately: a key that switches tabs
# everywhere is easier for a beginner than one that switches tabs only sometimes, and
# nano's selection is a nicety rather than something the course depends on. The
# alternative -- `if -F "#{alternate_on}" { send-keys S-Left } { previous-window }` --
# is what the mouse bindings in Part 3 do, and it was considered and rejected here for
# exactly that reason.

bind -N "New tab"      -n M-t     new-window
bind -N "New tab"      -n C-t     new-window
bind -N "Previous tab" -n M-Left  previous-window
bind -N "Previous tab" -n S-Left  previous-window
bind -N "Next tab"     -n M-Right next-window
bind -N "Next tab"     -n S-Right next-window


# =============================================================================
# PART 3 -- THE MOUSE, AND THE COPY-MODE TRAP
# =============================================================================
#
# THE TRAP
# --------
# All mouse handling in tmux lives in the *root* key table, so Part 1 destroyed
# it. Turning `mouse on` without rebuilding those bindings gives a session where
# the wheel does nothing.
#
# Worse: tmux's wheel-up does not scroll, it ENTERS COPY MODE -- a modal state
# with its own key table. With `unbind -a -T copy-mode` in force and nothing
# rebound, a student who brushes the scroll wheel lands in a mode where the
# keyboard is silently dead and there is no key that leaves. That is the single
# worst failure mode available to us, so it is handled explicitly and tested
# explicitly.
#
# The fix has three independent layers, all of them config:
#   (a) `copy-mode -e` -- documented: "scrolling to the bottom of the history
#       should exit copy mode". Scroll back down and you are simply out.
#   (b) the `Any` key -- documented: "A command bound to the Any key will
#       execute for all keys which do not have a more specific binding". So any
#       keystroke at all cancels copy mode. One keypress is lost; nothing else.
#   (c) a self-expiring plain-English message saying what happened.

set -g mouse on

# Scrollback depth. Default is 2000 lines, which a single `pip install` blows
# past. 50k lines x 100 cols is a few MB per tab -- fine against the container's
# memory cap, which is set per-machine in .config/local.args.
set -g history-limit 50000

# --- root table: mouse in a normal (not scrolled-back) pane ------------------

# Wheel up: if the program in the pane is a full-screen app (vim, less, htop) or
# has asked for mouse reporting (claude), forward the event so the APP scrolls.
# Otherwise enter copy mode with -e, i.e. "scroll back, and pop out again at the
# bottom". This is tmux's own default logic, minus the parts that touch panes.
bind -n WheelUpPane \
    if -F "#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}" \
        { send-keys -M } \
        { copy-mode -e ; display-message -d 3000 "SCROLLED BACK -- scroll down, or press any key, to type again" }

# Wheel down: stock tmux does NOT bind this in the root table at all, so
# scrolling down inside a mouse-aware TUI is silently dropped. Bind it, because
# "the wheel works in both directions" is table stakes.
bind -n WheelDownPane \
    if -F "#{||:#{alternate_on},#{mouse_any_flag}}" \
        { send-keys -M }

# Click in the pane: forward to the app (so a novice can click buttons/links in
# claude, or position the cursor in an editor). `send-keys -M` is a no-op when
# the app has not requested mouse reporting, so a stray click in bash does
# nothing at all -- which is what we want.
bind -n MouseDown1Pane send-keys -M

# Drag in the pane = select text. Guarded the same way, so dragging inside a
# mouse-aware app still reaches the app. Otherwise `copy-mode -M` starts a
# selection; MouseDragEnd1Pane (copy-mode table, below) copies and exits.
#
# NOTE: this is the *fallback* selection path. On every mainstream emulator
# SHIFT+drag bypasses mouse reporting entirely and gives the terminal's own
# native selection, which tmux never sees. Both work; both end in the host
# clipboard.
bind -n MouseDrag1Pane \
    if -F "#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}" \
        { send-keys -M } \
        { copy-mode -M }

# Double / triple click select a word / line and copy it. Same guard.
bind -n DoubleClick1Pane \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { copy-mode -H ; send-keys -X select-word ; send-keys -X copy-pipe-and-cancel ; display-message -d 2500 "COPIED that word to the clipboard." }
bind -n TripleClick1Pane \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { copy-mode -H ; send-keys -X select-line ; send-keys -X copy-pipe-and-cancel ; display-message -d 2500 "COPIED that line to the clipboard." }

# Clicking a tab in the bar switches to it. `=` is the documented token for
# "the window the mouse was over". Stock tmux binds this to `switch-client -t =`,
# which also switches SESSION; `select-window` cannot do anything but change tab.
bind -n MouseDown1Status select-window -t=

# FORK: clicking the "+ NEW TAB" chip opens one.
#
# This is the ONLY action in the whole configuration that needs no keyboard at all, which
# is why it exists: see Part 2 for why the ALT keys cannot be relied on across platforms.
# It is also the only affordance a student can DISCOVER rather than be told about.
#
# `MouseDown1StatusRight` fires for a click inside the `range=right` region of the status
# line, which status-format[1] (Part 4) wraps around status-right and nothing else. Since
# status-right now holds only the chip, the click region and the button are the same
# rectangle. tmux falls back to the generic `MouseDown1Status` for clicks outside any
# specific range, so the tab-clicking binding above is unaffected.
bind -n MouseDown1StatusRight new-window

# --- NO SCROLLBAR, AND THIS IS DELIBERATE -----------------------------------
#
# tmux 3.6 can draw a per-pane scrollbar, and it was enabled in the prototype because it is
# the clearest possible signal that "there is more text above". IT HAD TO BE REMOVED: it
# makes full-screen programs flicker so badly that nano is genuinely hard to use.
#
# The mechanism, measured rather than guessed: tmux shows the scrollbar only when there is
# scrollback to show, and an alternate-screen program (nano, vim, less, htop) has none. So
# tmux adds and removes the scrollbar column repeatedly, and each change resizes the pane:
#
#     pane-scrollbars on   ->  geometry oscillates 100x27 <-> 99x27, 8 changes in 5 seconds
#     pane-scrollbars off  ->  geometry constant 100x27, 0 changes
#
# Every one of those resizes makes ncurses reflow and repaint the entire screen. That is the
# flicker. It is not a rendering artifact and no amount of styling fixes it -- the pane
# really is changing width several times a second.
#
# Cost of removing it: no persistent visual cue that you are scrolled back. The transient
# "SCROLLED BACK" message is now the only indication.

%if "#{>=:#{version},3.6}"
    # FORK: state it. The prototype documented at length that the scrollbar must stay off
    # and then relied on `off` being tmux 3.6's default -- so its regression test passed
    # without the config having any opinion at all. If a later tmux flips the default the
    # flicker comes back silently. Both `pane-scrollbars` and the option that would make it
    # visible are 3.6-only, hence the gate.
    set -g pane-scrollbars off

    # Hide the copy-mode position indicator -- the "[0/0]" that appears in the top right the
    # moment a pane enters copy mode.
    #
    # Its default format is:
    #     [#{scroll_position}/#{history_size}]  (+ search result counts)
    # i.e. "you are N lines up from the bottom, out of M lines of stored scrollback".
    # Perfectly informative for a tmux user, and pure noise for a beginner -- worse, it shows
    # up when DRAGGING TO SELECT TEXT too, because a selection drag also enters copy mode.
    # Two students asking "what does [0/0] mean?" is two too many, so it is turned off.
    set -g copy-mode-position-format ""
%endif

# --- copy-mode table: the minimum needed to never be stuck -------------------
#
# Reached only by scrolling back. Everything here either scrolls, copies, or
# gets you out.

# Keep scrolling with the wheel. -e is still armed, so reaching the bottom exits.
# Re-showing the message on each notch keeps it on screen for as long as the student is
# actively scrolling, and for 3 seconds after they stop.
bind -T copy-mode WheelUpPane   send-keys -X -N 3 scroll-up \; display-message -d 3000 "SCROLLED BACK -- scroll down, or press any key, to type again"
bind -T copy-mode WheelDownPane send-keys -X -N 3 scroll-down

# Select-and-copy while scrolled back. copy-pipe-and-cancel copies AND leaves copy mode, so
# the selection gesture is self-terminating -- which looks like "it unselected itself and
# did nothing". Say what actually happened, and point at SHIFT+drag for anyone who would
# rather use their own terminal's selection.
bind -T copy-mode MouseDrag1Pane      send-keys -X begin-selection
bind -T copy-mode MouseDragEnd1Pane   send-keys -X copy-pipe-and-cancel \; display-message -d 2500 "COPIED to the clipboard.  (Or hold SHIFT while dragging to use your terminal's own selection.)"
bind -T copy-mode DoubleClick1Pane    send-keys -X select-word \; send-keys -X copy-pipe-and-cancel \; display-message -d 2500 "COPIED that word to the clipboard."
bind -T copy-mode TripleClick1Pane    send-keys -X select-line \; send-keys -X copy-pipe-and-cancel \; display-message -d 2500 "COPIED that line to the clipboard."

# The tab actions must keep working while scrolled back, otherwise the tab bar becomes dead
# the moment you touch the wheel. `copy-mode -q` cancels the mode first so the student is
# back at a live prompt in the new tab.
#
# FORK: C-t, S-Left and S-Right are repeated here for the same reason the prototype
# repeated the ALT keys. Missing one of these is invisible until someone scrolls back and
# then tries to change tab, which is exactly the moment a confused student reaches for it.
bind -T copy-mode M-t     copy-mode -q \; new-window
bind -T copy-mode C-t     copy-mode -q \; new-window
bind -T copy-mode M-Left  copy-mode -q \; previous-window
bind -T copy-mode S-Left  copy-mode -q \; previous-window
bind -T copy-mode M-Right copy-mode -q \; next-window
bind -T copy-mode S-Right copy-mode -q \; next-window

# THE ESCAPE HATCH. Any other key whatsoever leaves copy mode. This is the
# documented `Any` pseudo-key; more specific bindings above still win, so the
# wheel keeps scrolling. Net effect: it is impossible to be stuck. The keystroke
# that triggers it is consumed, so a student who types "ls" while scrolled back
# gets "s" -- mildly confusing, infinitely better than a dead keyboard.
bind -T copy-mode Any copy-mode -q


# =============================================================================
# PART 4 -- THE TAB BAR
# =============================================================================
#
# COLOUR POLICY
# -------------
# Every colour below is an xterm-256 cube/greyscale index (16-255). Those are
# fixed by spec, so they render identically in every terminal. ANSI 0-15 and
# "default" are NOT used anywhere: every terminal theme redefines them, so a bar
# built from them is legible for whoever wrote it and invisible for a student on
# macOS Terminal.app's light "Basic" profile.
#
# THE CHROME SETS NO BACKGROUND OF ITS OWN, and that was dropped deliberately: tmux
# silently drops a background that matches the one it detected for the terminal, so
# `bg=colour234` was never emitted at all and the bar rendered as bare foreground over the
# host theme -- 13.2:1 on a dark theme, 1.6:1 on a light one. Which value gets suppressed
# depends on the terminal, so a bar that looks right on one machine can vanish on another.
# Only small chips carry a background, because they are UI elements rather than an attempt
# to paint the terminal, and each carries its own explicit foreground AND background.
#
#   colour238 (68,68,68)     inactive tab background
#   colour117 (135,215,255)  ACTIVE tab background -- the bright block
#   colour16  (0,0,0)        text on the active tab            13.2:1
#   colour253 (218,218,218)  text on inactive tabs             7.0:1
#   colour243 (118,118,118)  separators                        4.5:1 light / 4.6:1 dark
#   colour244 (128,128,128)  pane border                       4.0:1 light / 5.3:1 dark
#   colour24  (0,95,135)     "N TABS" badge + title bar background
#   colour231 (255,255,255)  text on the badge and the title   7.0:1
#   colour22  (0,95,0)       "+ NEW TAB" chip background       8.0:1 against colour231
#   colour214 (255,175,0)    transient message background      11.4:1

set -g status on
# Top, because that is where tabs live in every browser and editor a student has
# ever used. Bottom-of-screen chrome reads as a footer, not as tabs.
set -g status-position top
set -g status-justify left
# Redraw the bar once a second: the tab label tracks the running process, and a
# 15s default would show "bash" for 15 seconds after `python3` starts.
set -g status-interval 1

set -g status-style "fg=colour243"

# --- left: how many tabs there are ------------------------------------------
# The bar must make it OBVIOUS that other tabs exist. A count states it in words, so it
# works even if the student has not yet learned to read the blocks. Singular/plural via
# the #{?...} conditional format.
set -g status-left-style "fg=colour231,bg=colour24"
set -g status-left-length 40
set -g status-left "#[fg=colour231,bg=colour24,bold] #{session_windows} TAB#{?#{>:#{session_windows},1},S,} #[fg=colour243,nobold] "

# --- middle: one block per tab, labelled with the running process ------------
#
# `#W` is the window name. With automatic-rename on (below) that name is
# recomputed from automatic-rename-format every redraw, so it follows the
# process with no scripting at all.
#
# The default formats are "#I:#W#{?window_flags,#{window_flags}, }". The flags
# (*, -, Z, !, #, M) are dropped here: they mean "active/last/zoomed/bell/
# activity/marked", none of which exist or matter in this configuration, and all
# of which are line noise to a beginner.
setw -g window-status-separator " "
setw -g window-status-style         "fg=colour253,bg=colour238"
setw -g window-status-format        "#[fg=colour253,bg=colour238] #I #W #[fg=colour243]"
setw -g window-status-current-style "fg=colour16,bg=colour117,bold"
setw -g window-status-current-format "#[fg=colour16,bg=colour117,bold] #I #W #[fg=colour243,nobold]"

# The bell/activity/last styles default to `reverse`, which (a) is theme
# dependent and (b) makes a tab flash inverted for reasons a beginner cannot
# explain. Setting them to `default` makes status-format skip inserting them
# entirely, so the tab keeps the explicit colours above.
setw -g window-status-activity-style default
setw -g window-status-bell-style     default
setw -g window-status-last-style     default
setw -g monitor-activity off
setw -g monitor-bell     off

# --- right: the new-tab button ----------------------------------------------
#
# FORK: the prototype put a keyboard cheat sheet here -- "ALT+T new tab   ALT+LEFT /
# ALT+RIGHT switch tab" -- width-gated to 80 columns so it would yield to the tabs on a
# narrow terminal. Both the hint and the gate are gone, by course decision: the keys are
# taught in class rather than advertised in the chrome, which keeps the bar quiet and
# leaves room for tab labels at every width.
#
# What replaces it is a button rather than a reminder. It is deliberately NOT width-gated:
# the hint it replaced was a convenience, but this is the only route to a new tab that
# needs neither a working ALT key nor prior instruction, so it must survive at any size.
# At 11 columns it is also far less greedy than the 90-column hint it replaced.
#
# TWO FORMAT TRAPS, both found the hard way in the prototype and recorded here because
# anyone adding a width-gated element back would hit them again:
#   * `#{>=:a,b}` is a STRING comparison, so "100" >= "80" is FALSE. Numeric comparison
#     requires the `e|` prefix: `#{e|>=:a,b}` (tmux(1), "Numeric operators").
#   * `#{client_width}` is EMPTY when no client is attached, which silently evaluates the
#     whole conditional to nothing. `#{window_width}` is always populated.
set -g status-right-style "fg=colour243"
set -g status-right-length 20
set -g status-right "#[fg=colour231,bg=colour22,bold] + NEW TAB #[fg=colour243,bg=default,nobold]"

# --- a title bar above the tabs ---------------------------------------------
#
# tmux can draw up to five status lines (`status [off|on|2|3|4|5]`). Line 0 is the topmost
# when status-position is top, so line 0 becomes the course title bar and line 1 carries
# the tabs.
#
# This title bar is the thing the container could not have before. A persistent header was
# investigated with escape sequences alone and rejected -- DECSTBM reserves rows but
# discards anything scrolled out of the region, measured at 40 lines in and 10 retained.
# A pty multiplexer is what makes it possible without that cost.
#
# WHY status-format[1] IS SPELLED OUT HERE. Line 1 has its own stock default (a pane list),
# which is not what we want, so the tab-bar composition has to be written explicitly. It is
# a lightly simplified copy of tmux's built-in status-format[0]: the bell/activity/
# last-window conditionals are dropped, since monitor-activity and monitor-bell are off and
# those styles are set to `default` above.
#
# The `range=` markers are LOAD-BEARING and must not be removed. They are what tell tmux
# which columns belong to which window, and therefore what makes `MouseDown1Status
# select-window -t=` (clicking a tab) and `MouseDown1StatusRight` (clicking the + NEW TAB
# chip) work at all. A hand-rolled tab bar without them looks identical and is silently
# unclickable.
set -g status 2

# FORK: "CS193V", not "CS193". The prototype dropped the V; every other student-facing
# string in this project -- the entry banner, the window title, the hostname
# cs193v-development -- has it, and the title bar is the most visible of the lot.
set -g 'status-format[0]' "#[align=centre,fg=colour231,bg=colour24,bold] CS193V Development Environment "

set -g 'status-format[1]' "#[align=left range=left #{E:status-left-style}]#{T;=/#{status-left-length}:status-left}#[norange default]#[list=on align=left]#{W:#[range=window|#{window_index} #{E:window-status-style}]#{T:window-status-format}#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#{T:window-status-current-format}#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#{T;=/#{status-right-length}:status-right}#[norange default]"

# --- a border between the chrome and the student's output --------------------
#
# HONEST LIMITATION: this is a top edge, not a box. tmux only draws pane borders BETWEEN
# panes, so with the single full-width pane this configuration uses there is nothing to
# draw on the left, right, or bottom -- `pane-border-status top` is as close to "a border
# around the terminal" as tmux gets.
#
# pane-border-format is deliberately empty: the tab bar already names the running process,
# so a title on the border would just repeat it.
#
# FOREGROUND ONLY, NO BACKGROUND. colour244 (#808080) is picked to survive both extremes
# unaided: 4.0:1 on white, 5.3:1 on black. A divider is a graphical element, so the
# applicable standard is WCAG's 3:1 for non-text contrast, which it clears either way.
#
# `pane-border-lines heavy` draws U+2501, so this needs a UTF-8 locale or tmux substitutes
# an underscore. The image sets LANG/LC_ALL to en_US.UTF-8, so that holds.
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-lines heavy
set -g pane-border-style        "fg=colour244"
set -g pane-active-border-style "fg=colour244"

# --- transient messages -----------------------------------------------------
#
# `display-message -d <ms>` is tmux's own self-expiring status message: it takes over
# status line 0 (the title bar, which is decorative -- the tab bar stays visible), then
# restores itself. That is what makes "tell the student what just happened, then get out of
# the way" possible without any timers, hooks, or scripts.
#
# This replaced a persistent banner keyed off #{pane_in_mode}, which was wrong in two ways,
# both reported from real use: it stayed up for as long as you stayed scrolled back, which
# is far too long for a warning; and #{pane_in_mode} is ALSO true while dragging to select
# text, so highlighting a word flashed up a message about scrolling.
#
# Explicit colours, like everything else in this file: amber background, near-black text,
# 11.4:1 on either host theme.
set -g message-style         "fg=colour16,bg=colour214,bold"
set -g message-command-style "fg=colour16,bg=colour214,bold"

# --- the process-name labels themselves -------------------------------------
#
# This is the whole of the "tabs are labelled by the name of the process" requirement, and
# tmux does it natively.
#
# `automatic-rename on` is already the default. The default FORMAT is
#     #{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}
# i.e. the pane's foreground process name (bash / python3 / claude) -- but the literal
# string "[tmux]" whenever the pane is in copy mode, and "[dead]" for a dead pane. Both are
# jargon a beginner cannot decode, and the copy-mode case would replace the useful label at
# exactly the moment the student is confused. Overridden to just the process name.
setw -g automatic-rename on

# Just the process name, with no special-casing.
#
# A previous version mapped the transient value `tmux` (which is what the pane's foreground
# process briefly is while a new tab starts up) to "[new tab]". That was backed out: the
# same transient also occurs when a process EXITS, so "[new tab]" would flash up on a tab
# the student had been using for an hour, which is worse than the honest brief flash of
# "tmux" it was meant to hide. `new-window -n "[new tab]"` is not an alternative either:
# passing -n also sets automatic-rename OFF, pinning the label forever.
#
# The one case this format gets wrong is an npm-installed script, which /proc reports as
# its interpreter -- `claude` reads as `node`. That is fixed shell-side in
# /etc/cs193v/tabname.bash rather than here, because the fix needs the typed command line
# and no tmux format exposes it. See that file.
setw -g automatic-rename-format "#{pane_current_command}"

# Belt and braces: `allow-rename off` (already the default in 3.6) stops a
# program's OSC 2 title escape from overwriting the tab label. Without it, a
# shell prompt that sets the window title would clobber the process name -- and
# this image's ~/.bashrc does exactly that on every prompt.
setw -g allow-rename off

# Number tabs from 1. "Tab 0" is a needless thing to explain.
set -g base-index 1
# ...and keep them consecutive after a tab in the middle is closed, so the
# numbers on screen always match "the third tab from the left".
set -g renumber-windows on


# =============================================================================
# PART 5 -- LIFECYCLE
# =============================================================================

# When the shell in a pane exits, the pane dies and the window closes. `off` is
# the default; stated explicitly because `on` would leave a "Pane is dead"
# corpse on screen with no key bound to clear it.
setw -g remain-on-exit off

# Closing the last window destroys the session; destroying the session detaches
# (and therefore exits) the client. Default is on; stated because the "exit closes a tab,
# the last exit leaves the container" behaviour depends on it -- without it the student
# would be dropped into a bare tmux with no session.
set -g detach-on-destroy on

# No sessions left -> the server exits. Guarantees no lingering tmux server.
# Default is on; stated because the same behaviour depends on it.
set -s exit-empty on

# FORK, AND THIS IS THE LOAD-BEARING ONE. The prototype set `destroy-unattached on`,
# because its requirements forbade detach/reattach outright and an orphaned session is an
# invisible thing a student cannot see, cannot explain, and will file a support ticket
# about.
#
# In THIS container that setting would reverse a property that was measured, documented and
# is regression-tested: a server keeps running when the student closes their terminal
# window. See ERRORS.md section D, tests/70-sighup.sh, and the rough-edges section of
# CONTAINER-DESIGN.md. With `destroy-unattached on`, closing the window destroys the
# session, which kills every pane, which kills the dev server the student left running --
# turning a documented "your work survives" into "closing the window throws it away".
#
# So it is `off`, and the orphaned-session objection is answered a different way:
# cs193v-shell attaches to a session that has no client before it creates a new one. A
# session orphaned by a closed window is therefore the session you get back on your next
# `./cs193v`, rather than something invisible accumulating in the background.
set -g destroy-unattached off


# =============================================================================
# PART 6 -- TERMINAL PLUMBING
# =============================================================================

# OSC 52 clipboard. `on` = tmux both (a) writes the host clipboard when something is copied
# inside tmux and (b) forwards an inner application's own OSC 52 write outward. The default
# `external` does (a) but silently drops (b), so a copy made by a program running in a tab
# would go nowhere.
set -s set-clipboard on

# `set-clipboard` only fires if the client terminal is known to support the clipboard
# escape, and stock terminal-features covers `xterm*` only. The launcher forwards a
# whitelisted TERM which may be screen-256color or tmux-256color, so declare it for
# everything. Safe: OSC 52 is ignored by terminals that do not implement it.
set -as terminal-features "*:clipboard"

# Truecolour, so `#RRGGBB` styles would not be down-sampled if we used any.
# (We use 256-cube indices, which need nothing, but a student's own programs benefit.)
set -as terminal-features "*:RGB"

# FORK: the host terminal's window title.
#
# This image points the window title at the course by rewriting the OSC 0 escape inside
# ~/.bashrc's PS1 (see files/rewrite-window-title.py). Inside tmux that no longer reaches
# the terminal: `allow-rename off` in Part 4 deliberately swallows the shell's title
# escape, and tmux only writes the outer terminal's title itself when `set-titles` is on,
# which is NOT the default. Without these three lines the window title silently stops
# naming the course the moment tmux becomes the landing point.
#
# `*:title` for the same reason as `*:clipboard` above: stock terminal-features grants the
# title capability to `xterm*` only.
#
# The path is the absolute one rather than PS1's tilde-abbreviated `\w`. tmux has no `\w`
# equivalent; a `#{s|^/home/student|~|:pane_current_path}` substitution would produce it,
# and was left out on the grounds that a regular expression in the window chrome is a poor
# trade for a cosmetic gain.
set -as terminal-features "*:title"
set -g set-titles on
set -g set-titles-string "CS193V Development Environment  #{pane_current_path}"

# A student pressing Escape inside vim/claude should not have it swallowed while
# tmux waits to see if it was the start of a M- sequence. 10ms is the default and
# is the right trade-off: long enough to assemble ESC-prefixed ALT keys from
# macOS Terminal.app, short enough to feel instant.
set -s escape-time 10

# Redraw a tab's contents to fit whatever size the student's terminal is, even
# when it is not the tab being looked at. This matters more here than in the prototype:
# with reattach allowed, a session is routinely picked up by a terminal of a different
# size from the one that created it.
setw -g aggressive-resize on

# Full 256-colour + italics inside the container. REQUIRES the tmux-256color terminfo
# entry, which on Ubuntu ships in `ncurses-term` and NOT in the base `ncurses-base`. The
# Containerfile installs it explicitly for that reason; without it tmux refuses to start
# with "missing or unsuitable terminal".
set -g default-terminal "tmux-256color"

# Not strictly needed, but a beginner resizing their terminal window mid-command
# should not see stale layout.
set -g focus-events on
