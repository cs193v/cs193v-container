# CS193V tmux configuration — the RESTRICTED environment.
#
# Installed as /etc/cs193v/tmux.conf in the `restricted` stage, which is the path
# cs193v-shell names with an explicit `-f`. The shared configuration goes in beside it as
# /etc/cs193v/tmux-shared.conf and is pulled in by the source-file below.
#
# THIS FILE IS AN OVERRIDE, NOT A FORK, and that is the only maintainable arrangement. The
# shared configuration is ~620 lines of measured decisions — the disarmed prefix tables, the
# six tab bindings, the mouse handling, the scrollback size, the reasons each colour was
# chosen. Copying it to change seven settings would mean every future fix had to be made
# twice, and the copy that got missed would be the sandbox. tmux applies the last `set` for
# an option, so sourcing first and re-setting after is all this needs.
#
# WHAT IT CHANGES, and why each one is here rather than in the shared file:
#
#   1. The clipboard, which is a security control rather than a preference. See below.
#   2. The title, in both places the shared file states it.
#   3. The colours: reds, so the two environments cannot be confused at a glance.
#   4. The five copy-mode messages, which would otherwise describe something that no
#      longer happens.
#
# Nothing else. If you find yourself adding a fifth category, consider whether it belongs
# in the shared file for both environments instead.
source-file /etc/cs193v/tmux-shared.conf

# ═══════════════════════════════════════════════════════════════════════════════
#  1. THE CLIPBOARD — this is the one setting here that is a security boundary.
# ═══════════════════════════════════════════════════════════════════════════════
# The shared file sets `set-clipboard on`, and its comment there says exactly what that
# does: tmux both writes the host clipboard when something is copied inside tmux, AND
# FORWARDS AN INNER APPLICATION'S OWN OSC 52 WRITE OUTWARD. In the development container
# that is a feature. Here it is an exfiltration channel, and a completely silent one: a
# script running over the sensitive data could emit an OSC 52 escape on stdout and land the
# data in the student's host clipboard, from where the next paste — plausibly into Claude —
# delivers it.
#
# `off` is the value that closes it, and it closes both halves. From tmux(1): with `off`,
# tmux "will neither accept the clipboard escape sequence nor attempt to set the clipboard".
# `external` would be wrong here — it still writes the host clipboard, it only ignores
# applications setting tmux buffers.
#
# This is worth a lecture demo: the same script emits OSC 52 in both containers, and the
# host clipboard changes in exactly one of them. 60-container.sh asserts both directions.
set -s set-clipboard off

# Set EXPLICITLY even though `off` is tmux's own default, on the same principle as
# ncurses-term and fontconfig in the Containerfile: a default is not a promise. This is a
# DCS passthrough (ESC Ptmux;...), a second and quite separate way for a pane to hand raw
# escapes to the outer terminal, so it needs its own line rather than being covered by the
# clipboard setting above.
set -g allow-passthrough off

# ═══════════════════════════════════════════════════════════════════════════════
#  2. THE TITLE
# ═══════════════════════════════════════════════════════════════════════════════
# Must agree with CS193V_TITLE in cs193v-strings-restricted.sh and with the argument the
# Containerfile passes to rewrite-window-title.py. The shared file states the title twice —
# once for the bar drawn across the top of the terminal and once for the host window's own
# title — so both are re-stated here. 50-image.sh asserts all of them name the same
# environment, which is the only thing keeping five copies of a string honest.
#
# status-format[0] carries the background colour as well, so it is also part of item 3.
set -g 'status-format[0]' "#[align=centre,fg=colour231,bg=colour88,bold] CS193V: Restricted Environment "
set -g set-titles-string "CS193V: Restricted Environment  #{pane_current_path}"

# ═══════════════════════════════════════════════════════════════════════════════
#  3. THE COLOURS — reds, and from the chips only
# ═══════════════════════════════════════════════════════════════════════════════
# NOT THE TERMINAL BACKGROUND. Repainting it was tried and rejected — see the header of
# files/cs193v-welcome and issue #4: Ptyxis answers the OSC 11 query and then paints its own
# palette anyway, and macOS Terminal.app does not implement it at all, so the change was
# invisible on the default terminal of two of three platforms and could not be
# feature-detected. The shared file's own note says only small chips carry a background,
# each with an explicit foreground AND background. These follow that rule.
#
# Contrast is computed, not eyeballed, matching the table in the shared file:
#
#   colour88  (135,0,0)      title bar + "N TABS" badge background
#   colour231 (255,255,255)  text on both                       10.3:1   (dev: 7.0:1)
#   colour217 (255,175,175)  ACTIVE tab background -- the bright block
#   colour16  (0,0,0)        text on the active tab             12.0:1   (dev: 13.2:1)
#
# TWO THINGS DELIBERATELY STAY AS THEY ARE, because "make it all red" would cost more than
# it buys:
#
#   * The `+ NEW TAB` chip stays GREEN (colour22). It is an action affordance, not chrome.
#     On an all-red bar nothing is salient, which defeats the point of the red.
#   * The transient message background stays AMBER (colour214). A red message on red chrome
#     disappears exactly when it matters — and in this container the messages include the
#     clipboard notices rewritten below.
#
# The inactive tabs, separators and pane borders stay grey: they are neutral in both
# environments and re-stating them here would be four more strings to drift.
#
# The `#,` escapes inside status-left and window-status-current-format are NOT typos — the
# shared file documents the trap: the arms of #{?a,b,c} are split on commas before anything
# is expanded, so a comma inside `#[...]` must be escaped. Both format strings are copied
# from the shared file with only the colour numbers changed.
set -g status-left-style "fg=colour231,bg=colour88"
set -g status-left "#{?#{==:#{session_windows},1},,#[fg=colour231#,bg=colour88#,bold] #{session_windows} TABS #[fg=colour243#,nobold] }"

setw -g window-status-current-style "fg=colour16,bg=colour217,bold"
setw -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=colour16#,bg=colour217#,bold] #I #W #[fg=colour243#,nobold]}"

# ═══════════════════════════════════════════════════════════════════════════════
#  4. THE COPY MESSAGES — they must not claim something that no longer happens
# ═══════════════════════════════════════════════════════════════════════════════
# With set-clipboard off, a copy inside tmux still fills a tmux paste buffer, so
# CTRL+V-inside-this-container keeps working — but it no longer reaches the host clipboard.
# The shared file's five messages all say "COPIED to the clipboard", which in this container
# would be wrong in the one direction a student must not be misled about: whether data has
# left the sandbox.
#
# Re-bound rather than reworded in the shared file, because in the development container the
# original message is accurate. The key bindings themselves are copied verbatim; only the
# display-message text differs.
bind -n DoubleClick1Pane \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { copy-mode -H ; send-keys -X select-word ; send-keys -X copy-pipe-and-cancel ; display-message -d 2500 "COPIED that word -- inside this container only, NOT to your computer." }
bind -n TripleClick1Pane \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { copy-mode -H ; send-keys -X select-line ; send-keys -X copy-pipe-and-cancel ; display-message -d 2500 "COPIED that line -- inside this container only, NOT to your computer." }

bind -T copy-mode MouseDragEnd1Pane   send-keys -X copy-pipe-and-cancel \; display-message -d 2500 "COPIED -- inside this container only, NOT to your computer.  (SHIFT+drag uses your terminal's own selection, which DOES leave the sandbox.)"
bind -T copy-mode DoubleClick1Pane    send-keys -X select-word \; send-keys -X copy-pipe-and-cancel \; display-message -d 2500 "COPIED that word -- inside this container only, NOT to your computer."
bind -T copy-mode TripleClick1Pane    send-keys -X select-line \; send-keys -X copy-pipe-and-cancel \; display-message -d 2500 "COPIED that line -- inside this container only, NOT to your computer."
