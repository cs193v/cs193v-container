# CS193V managed Codex policy.
#
# Lives at /etc/codex/managed_config.toml -- deliberately NOT in ~/.codex, which is a named
# volume: a file placed there by the image is seeded once on first mount and then never
# refreshed by a later image, and a student can edit it. In /etc it is part of the image layer,
# so every --rebuild and every image update restore it. Same reasoning, and the same pair of
# reasons, as /etc/claude-code/managed-settings.json next door.
#
# THE THREE KEYS BELOW ARE CODEX'S OWN DEFAULTS FOR THE FIRST TWO, AND NOT FOR THE THIRD.
# Writing the defaults down is deliberate rather than redundant: it pins them against an
# upstream default that moves, and it puts the course's posture in one readable file instead of
# leaving a reader to infer it from an absence.
#
# THIS FILE IS ENFORCED, NOT A SET OF DEFAULTS (#529). Codex ranks managed_config.toml above the
# student's own ~/.codex/config.toml and above `-c` flags, and re-reads each key here as a
# requirement (`config/src/loader/mod.rs`, the same at 0.148 and 0.163). The one give is
# approvals_reviewer: `auto_review` also allows `user`, so a student can opt out of the reviewer.
# This header called these "managed DEFAULTS" until #529 measured otherwise. So ANY key added here
# is a pin -- a default a student should be able to change belongs in /etc/codex/config.toml,
# codex's lowest layer, and nothing is shipped there.
#
#   sandbox_mode = "workspace-write"
#       The boundary. Codex may read anywhere and write inside the workspace; anything further
#       is an escalation it has to ask about. On Linux this is enforced with bubblewrap, which
#       needs a nested user namespace -- see the staff README's open item for why that may not
#       hold inside rootless podman, and what codex does when it cannot get one.
#
#   approval_policy = "on-request"
#       WHEN codex stops to ask: when it wants out of the sandbox. The other values left since
#       0.149 retired "untrusted" are "never" and a granular table.
#
#   approvals_reviewer = "auto_review"
#       WHO answers. `user` is the default and puts the question to the student; `auto_review`
#       hands it to codex's reviewer subagent instead.
#
#       THIS IS A DECISION, and the one thing in this file that is not simply a written-down
#       default. The staff README records why (#71), and why it now matches Claude Code's own
#       starting mode, auto (#526).
#
# What is deliberately ABSENT:
#   requirements.toml     - not needed for these three, which this file already enforces (above).
#                           It would only matter for constraining a key this file does not name;
#                           #550 is one such key.
#   features.daemon_auto_start
#                         - codex's background server (0.157+) is left on, as any npm user gets
#                           it, and it follows OpenAI's latest release on its own. Setting it here
#                           would be a pin, not a default. See the staff README's "Codex's
#                           background server".
#   [tui]                 - the fullscreen TUI (codex's default since 0.157) is accepted but not
#                           written down: here it would take /tui -> Scrollback away from students.
#   [sandbox_workspace_write] and default_permissions
#                         - the reference says not to combine either with sandbox_mode.
#   MCP configuration     - none shipped, and not locked down either, matching Claude Code.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
